# Local administration by the PostgreSQL entrypoint and maintenance jobs.
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Physical streaming replication from the dedicated replica container.
host    replication     lab5_replication all                     scram-sha-256
host    all             all             all                     scram-sha-256
