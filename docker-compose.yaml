services:
  db:
    image: postgres:16-alpine
    container_name: mypills-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/internal/infra/postgres/init:/docker-entrypoint-initdb.d
  app:
    build: .
    container_name: mypills-app
    restart: always
    depends_on:
      - db
      - mailpit
    env_file:
      - .env
    ports:
      - "${SERVER_PORT}:8080"
    volumes:
      - ./logs:/root/logs
  gui:
    build: ./gui
    container_name: mypills-gui
    restart: always
    depends_on:
      - app
    environment:
      - VITE_API_BASE_URL=http://localhost:${SERVER_PORT}
    ports:
      - "${GUI_PORT}:5173"
  mailpit:
    image: axllent/mailpit:latest
    container_name: mypills-mailpit
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true

volumes:
  pgdata: