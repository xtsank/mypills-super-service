services:
  db:
    image: postgres:16-alpine
    container_name: mypills-db
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 30
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/internal/infra/postgres/init:/docker-entrypoint-initdb.d
      - ./backup:/seed/csv:ro
  app:
    build: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "${SERVER_PORT}:8080"
    volumes:
      - ./logs:/root/logs
  gui:
    build: ./gui
    restart: "no"
    depends_on:
      - app
    environment:
      - VITE_API_BASE_URL=http://localhost:${SERVER_PORT}
    ports:
      - "${GUI_PORT}:5173"

volumes:
  pgdata:
