proxy_pass http://$lab5_api_pool;
proxy_connect_timeout 1s;
proxy_read_timeout 5s;

# Only read pools have alternate peers. Each write pool contains one writer.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 3;

add_header X-Upstream-Addr $upstream_addr always;
access_log /var/log/nginx/access.log lab5_api;
access_log /var/log/mypills/lab5-nginx.jsonl lab5_api;
