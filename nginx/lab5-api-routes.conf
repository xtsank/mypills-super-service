location ~ ^/api/v[12]/ {
    set $lab5_api_path $uri;
    set $lab5_api_pool $mypills_api_pool;
    include /etc/nginx/mypills/lab5-api-proxy.conf;
}

location ~ ^/mirror/api/v[12]/ {
    set $lab5_api_path $uri;
    set $lab5_api_pool $mirror_api_pool;
    rewrite ^/mirror(/api/.*)$ $1 break;
    absolute_redirect off;
    proxy_redirect ~^(/api/.*)$ /mirror$1;
    add_header Set-Cookie $mirror_write_cookie always;
    include /etc/nginx/mypills/lab5-api-proxy.conf;
}
