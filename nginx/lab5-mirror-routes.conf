location = /mirror {
    absolute_redirect off;
    return 308 /mirror/$is_args$args;
}

location = /mirror/ {
    rewrite ^ /index.html break;
    sub_filter 'href="/' 'href="/mirror/';
    sub_filter 'src="/' 'src="/mirror/';
    sub_filter_once off;
}

location = /mirror/legacy {
    absolute_redirect off;
    return 308 /mirror/legacy/$is_args$args;
}

location /mirror/legacy/ {
    proxy_pass http://mirror-gui:80;
}

location = /mirror/documentation {
    alias /srv/web-documentation/index.html;
    default_type text/html;
    charset utf-8;
    sub_filter 'href="/' 'href="/mirror/';
    sub_filter 'src="/' 'src="/mirror/';
    sub_filter_once off;
}

location /mirror/static/img/ {
    rewrite ^/mirror(/static/img/.*)$ $1 last;
}

location /mirror/docs/ {
    rewrite ^/mirror(/docs/.*)$ $1 last;
}

location = /mirror/api/v1/docs {
    absolute_redirect off;
    return 308 /mirror/api/v1/docs/$is_args$args;
}

location = /mirror/api/v1/docs/ {
    proxy_pass http://mirror_write/swagger-v1/index.html;
}

location ^~ /mirror/api/v1/docs/ {
    proxy_pass http://mirror_write/swagger-v1/;
}

location = /mirror/api/v2/docs {
    absolute_redirect off;
    return 308 /mirror/api/v2/docs/$is_args$args;
}

location ^~ /mirror/api/v2/docs/ {
    proxy_pass http://mirror_write/swagger/;
}

location = /mirror/api/spec/v2.yaml {
    proxy_pass http://mirror_write/api/spec/v2.yaml;
}

location = /mirror/docs/openapi/v2.yaml {
    proxy_pass http://mirror_write/api/spec/v2.yaml;
}

location ~ ^/mirror(/swagger(?:-v1)?(?:/.*)?)$ {
    rewrite ^/mirror(/swagger.*)$ $1 break;
    proxy_pass http://mirror_write;
}

location = /monitoring {
    absolute_redirect off;
    return 308 /monitoring/;
}

location ^~ /monitoring/ {
    proxy_pass http://grafana:3000;
}
