user nginx;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    map "$status:$uri" $mypills_cache_control {
        ~^(200|206|304):/(mirror/)?legacy/assets/[^/]+\.(js|css)$ "public, max-age=31536000, immutable";
        ~^(200|206|304):/static/img/[^/]+\.png$ "public, max-age=3600";
        default "no-store";
    }

    more_set_headers 'Server: MyPills';
    more_set_headers 'Cache-Control: $mypills_cache_control';

    gzip on;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json application/yaml
               application/xml image/svg+xml;

    access_log /dev/stdout;
    include /etc/nginx/conf.d/*.conf;
}
